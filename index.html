<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>QR Code Generator</title>
  <script src="https://cdn.jsdelivr.net/npm/qrcodejs/qrcode.min.js"></script>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f4f6f8;
      text-align: center;
      padding: 40px;
    }
    .container {
      background: #fff;
      padding: 25px;
      border-radius: 12px;
      box-shadow: 0 4px 8px rgba(0,0,0,0.1);
      display: inline-block;
    }
    input {
      width: 250px;
      padding: 10px;
      border: 1px solid #ccc;
      border-radius: 8px;
      margin-bottom: 15px;
    }
    button {
      padding: 10px 18px;
      border: none;
      border-radius: 8px;
      background: #007bff;
      color: white;
      cursor: pointer;
      margin: 5px;
    }
    button:hover {
      background: #0056b3;
    }
    #qrcode {
      margin-top: 20px;
    }
  </style>
</head>
<body>

  <div class="container">
    <h2>QR Code Generator</h2>
    <input type="text" id="text" placeholder="Enter text or URL"><br>
    <button onclick="generateQR()">Generate QR</button>
    <button onclick="downloadQR()">Download</button>
    <div id="qrcode"></div>
  </div>

  <script>
    let qr;

    function generateQR() {
      let text = document.getElementById("text").value;
      document.getElementById("qrcode").innerHTML = ""; // clear old QR
      qr = new QRCode(document.getElementById("qrcode"), {
        text: text,
        width: 200,
        height: 200
      });
    }

    function downloadQR() {
      if (!qr) return alert("Generate a QR code first!");
      let img = document.querySelector("#qrcode img");
      if (img) {
        let link = document.createElement("a");
        link.href = img.src;
        link.download = "qrcode.png";
        link.click();
      }
    }
  </script>

</body>
</html>
